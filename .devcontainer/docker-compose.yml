
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20-bullseye
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
